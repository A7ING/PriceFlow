version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: price_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: price_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: price_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: price_api
    init: true
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  parser_worker:
    build: ./backend
    container_name: price_parser
    init: true
    restart: always
    # ВАЖНО: Раскомментируй нужную команду в зависимости от того, как ты запускаешь задачи:
    # Вариант А (если используешь Celery в tasks.py):
    # command: celery -A services.tasks worker --loglevel=info
    # Вариант Б (если у тебя кастомный скрипт/цикл в parser.py):
    # command: python -m services.parser
    depends_on:
      - db
      - redis
    tmpfs:
      - /tmp   # Защищает диск сервера от мусора браузеров Playwright
    deploy:
      resources:
        limits:
          cpus: '0.40'   # Ограничивает парсер, чтобы он не положил весь сервер
          memory: 400M

  frontend:
    build: ./frontend
    container_name: price_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api   # Теперь фронтенд ждет запуска API, а не старого backend

volumes:
  postgres_data:
services:
  db:
    image: postgres:15-alpine
    container_name: price_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: price_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: price_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: price_backend
    restart: always
    init: true
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    tmpfs:
      - /tmp
      - /dev/shm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: price_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: